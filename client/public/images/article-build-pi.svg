<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <!-- 背景 -->
  <rect width="1200" height="630" fill="#0d1117"/>
  <!-- 代码风格装饰 -->
  <text x="60" y="80" font-family="monospace" font-size="16" fill="#3b4252">import { AgentLoop } from './pi'</text>
  <text x="60" y="110" font-family="monospace" font-size="16" fill="#3b4252">const agent = new AgentLoop({ model, tools })</text>
  <text x="60" y="140" font-family="monospace" font-size="16" fill="#3b4252">await agent.run("读取 README，修复测试")</text>
  <!-- 主标题区域 -->
  <rect x="60" y="200" width="80" height="5" fill="#58a6ff"/>
  <text x="60" y="270" font-family="monospace" font-size="22" fill="#58a6ff" letter-spacing="3">BUILD YOUR OWN PI</text>
  <text x="60" y="340" font-family="serif" font-size="58" font-weight="bold" fill="#f0f6fc">动手学 Pi</text>
  <text x="60" y="410" font-family="sans-serif" font-size="30" fill="#8b949e">从一条运行轨迹开始，亲手造一个 AI Agent</text>
  <!-- Agent Loop 图示 -->
  <rect x="750" y="220" width="380" height="320" rx="16" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="790" y="265" font-family="monospace" font-size="14" fill="#8b949e">// agent loop</text>
  <text x="790" y="300" font-family="monospace" font-size="15" fill="#7ee787">user</text>
  <text x="850" y="300" font-family="monospace" font-size="15" fill="#8b949e">→ 修复失败测试</text>
  <text x="790" y="335" font-family="monospace" font-size="15" fill="#d2a8ff">model</text>
  <text x="860" y="335" font-family="monospace" font-size="15" fill="#8b949e">→ toolCall: read()</text>
  <text x="790" y="370" font-family="monospace" font-size="15" fill="#ffa657">tool</text>
  <text x="850" y="370" font-family="monospace" font-size="15" fill="#8b949e">→ toolResult: ✓</text>
  <text x="790" y="405" font-family="monospace" font-size="15" fill="#d2a8ff">model</text>
  <text x="860" y="405" font-family="monospace" font-size="15" fill="#8b949e">→ toolCall: edit()</text>
  <text x="790" y="440" font-family="monospace" font-size="15" fill="#ffa657">tool</text>
  <text x="850" y="440" font-family="monospace" font-size="15" fill="#8b949e">→ toolResult: ✓</text>
  <text x="790" y="475" font-family="monospace" font-size="15" fill="#d2a8ff">model</text>
  <text x="860" y="475" font-family="monospace" font-size="15" fill="#8b949e">→ toolCall: bash()</text>
  <text x="790" y="510" font-family="monospace" font-size="15" fill="#7ee787">loop</text>
  <text x="850" y="510" font-family="monospace" font-size="15" fill="#7ee787">→ stop ✓ 测试通过</text>
  <!-- 底部信息 -->
  <text x="60" y="560" font-family="sans-serif" font-size="20" fill="#8b949e">邢鹏 · TypeScript · 15 Checkpoints</text>
  <rect x="0" y="620" width="1200" height="10" fill="#58a6ff" opacity="0.4"/>
</svg>
