  <rect x="530" y="350" width="130" height="34" rx="17" fill="none" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="595" y="372" font-family="monospace" font-size="12" fill="#a78bfa" text-anchor="middle">零遥测</text>
