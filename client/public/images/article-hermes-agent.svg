  <text x="80" y="255" font-family="sans-serif" font-size="26" fill="#a78bfa">越用越聪明的本地 AI 私人助理</text>
  <text x="80" y="300" font-family="monospace" font-size="16" fill="#666">The agent that grows with you.</text>
  <!-- 特性标签 -->
  <rect x="80" y="350" width="130" height="34" rx="17" fill="none" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="145" y="372" font-family="monospace" font-size="12" fill="#a78bfa" text-anchor="middle">持久记忆</text>
  <rect x="230" y="350" width="130" height="34" rx="17" fill="none" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="295" y="372" font-family="monospace" font-size="12" fill="#a78bfa" text-anchor="middle">自进化 Skill</text>
  <rect x="380" y="350" width="130" height="34" rx="17" fill="none" stroke="#7c3aed" stroke-width="1.5"/>
