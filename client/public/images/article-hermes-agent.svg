  <line x1="900" y1="200" x2="850" y2="350" stroke="#7c3aed" stroke-width="0.5" opacity="0.3"/>
  <line x1="1020" y1="300" x2="850" y2="350" stroke="#7c3aed" stroke-width="0.5" opacity="0.3"/>
